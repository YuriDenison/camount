name: JS CI

on:
  push:
    branches: [main]
    paths:
      - 'camount-js/**'
      - '.github/workflows/js.yml'
  pull_request:
    paths:
      - 'camount-js/**'
      - '.github/workflows/js.yml'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: camount-js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: camount-js/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
